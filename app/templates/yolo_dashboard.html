<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🪖 전차 전투 대시보드</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/style.css" />
    
    <!-- ✅ JS 파일 로드: dashboard → crosshair 분리 -->
    <script defer src="/static/js/dashboard.js"></script>
    <script defer src="/static/js/crosshair.js"></script>
    <style>
      /* 위험 등급 색상 스타일링 */
      .threat-level-1 { color: #28a745; font-weight: bold; } /* 초록 */
      .threat-level-2 { color: #ff9800; font-weight: bold; } /* 주황 */
      .threat-level-3 { color: #dc3545; font-weight: bold; } /* 빨강 */
      .threat-normal { color: gray; }
      .threat-none { color: #666; }
      /* HUD 위협 감지 색상 */
      .danger.threat-level-1 { background-color: rgba(40, 167, 69, 0.1); }
      .danger.threat-level-2 { background-color: rgba(255, 152, 0, 0.1); }
      .danger.threat-level-3 { background-color: rgba(220, 53, 69, 0.1); }
    </style>
  </head>

  <body>
    <!-- 🔄 로딩 스크린 -->
    <div id="loading-screen" class="loading-overlay">
      <div class="loader"></div>
      <div id="loading-status">📡 대시보드 준비 중...</div>
    </div>

    <!-- 🖼️ 메인 컨테이너 (탐지 영상 + 객체 리스트) -->
    <div class="main-container">
      <!-- 탐지영상 + 조준선 -->
      <div class="video-section">
        <h3>탐지 영상</h3>
        <div class="video-wrapper">
          <img id="live-image" src="/video_feed" alt="탐지 결과" />
          
          <!-- ✨ 조준선 + 거리 텍스트 -->
          <div id="crosshair-wrapper">
            <canvas id="crosshair-canvas" width="200" height="200"></canvas>
            <div id="hud-distance">-- m</div>
          </div>
        </div>
        <div id="fps"></div>
      </div>

      <!-- 탐지된 객체 리스트 테이블 -->
      <div class="object-list-section">
        <h3>탐지된 객체 목록</h3>
        <div class="object-list-wrapper">
          <table id="object-list">
            <thead>
              <tr>
                <th>클래스명</th>
                <th>ID</th>
                <th>위험등급</th>
                <th>위치</th>
              </tr>
            </thead>
            <tbody id="object-list-body">
              <tr>
                <td colspan="4" style="text-align:center;">위험요소 없음</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 📊 HUD 정보 패널 -->
    <div class="hud">
      <div class="hud-item" id="speed">속도: 0 km/h</div>
      <div class="hud-item" id="position">좌표: 없음</div>
      <div class="hud-item" id="health">
        <div>전차 체력</div>
        <div class="health-bar">
          <div id="health-fill" class="health-fill"></div>
        </div>
        <div id="health-text">100%</div>
      </div>
      <div class="hud-item danger" id="threat">🚨 위협 감지: 없음</div>
      <div class="hud-item" id="comm">
        <div>📡 통신 신호</div>
        <div class="signal-bar">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>
      <div class="hud-item" id="gear">
        🔧 기어: <span id="gear-level">2</span>
      </div>
    </div>

    <!-- ⚠️ 알림창 -->
    <div id="alert-box" class="alert hidden">알림창</div>

    <script>
      // 객체 목록 업데이트
      async function updateObjects() {
        try {
          const response = await fetch('/get_detected_objects');
          const data = await response.json();
          const objectListBody = document.getElementById('object-list-body');
          const threatDiv = document.getElementById('threat');

          // 객체 목록 초기화
          objectListBody.innerHTML = '';

          if (data.objects.length === 0) {
            objectListBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">위험요소 없음</td></tr>';
            threatDiv.innerHTML = '🚨 위협 감지: 없음';
            threatDiv.className = 'hud-item danger threat-none';
            return;
          }

          // 위험 등급 우선순위 (LEVEL 3 > LEVEL 2 > LEVEL 1)
          const threatPriority = { 'LEVEL 3': 3, 'LEVEL 2': 2, 'LEVEL 1': 1, 'Normal': 0 };
          let highestThreat = 'Normal';
          let highestThreatLevel = 0;

          // 객체 목록 표시
          data.objects.forEach(obj => {
            const threatClass = obj.threat === 'LEVEL 1' ? 'threat-level-1' :
                              obj.threat === 'LEVEL 2' ? 'threat-level-2' :
                              obj.threat === 'LEVEL 3' ? 'threat-level-3' :
                              'threat-normal';

            // 위치 정보 (바운딩 박스 중심)
            const x = Math.round((obj.bbox[0] + obj.bbox[2]) / 2);
            const y = Math.round((obj.bbox[1] + obj.bbox[3]) / 2);

            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${obj.className}</td>
              <td>${obj.id}</td>
              <td><span class="${threatClass}">${obj.threat}</span></td>
              <td>(${x}, ${y})</td>
            `;
            objectListBody.appendChild(row);

            // 가장 높은 위험 등급 계산
            const threatLevel = threatPriority[obj.threat] || 0;
            if (threatLevel > highestThreatLevel) {
              highestThreatLevel = threatLevel;
              highestThreat = obj.threat;
            }
          });

          // HUD 위협 감지 업데이트
          const threatClass = highestThreat === 'LEVEL 1' ? 'threat-level-1' :
                             highestThreat === 'LEVEL 2' ? 'threat-level-2' :
                             highestThreat === 'LEVEL 3' ? 'threat-level-3' :
                             'threat-normal';
          threatDiv.innerHTML = `🚨 위협 감지: <span class="${threatClass}">${highestThreat}</span>`;
          threatDiv.className = `hud-item danger ${threatClass}`;
        } catch (error) {
          console.error('Error updating objects:', error);
        }
      }

      // 주기적으로 객체 목록 업데이트
      setInterval(updateObjects, 1000);
      updateObjects();
    </script>
  </body>
</html>
