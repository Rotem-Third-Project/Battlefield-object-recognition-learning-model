<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🪖 전차 전투 대시보드</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
      /* 🔄 로딩 화면 */
      .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        color: #00ff00;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-family: "Share Tech Mono", monospace;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }

      .loader {
        border: 5px solid #333;
        border-top: 5px solid #00ff00;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #live-image {
        display: none;
        border: 2px solid #00ff00;
        max-width: 100%;
        margin: 1rem auto;
        box-shadow: 0 0 10px #00ff00;
      }
    </style>
  </head>

  <body>
    <!-- 🔄 로딩 스크린 -->
    <div id="loading-screen" class="loading-overlay">
      <div class="loader"></div>
      <div id="loading-status">📡 대시보드 준비 중...</div>
    </div>

    <!-- 🖼️ 실시간 MJPEG 영상 -->
    <div>
      <h3>탐지 영상</h3>
      <img id="live-image" src="/video_feed" alt="탐지 결과" />
      <div
        id="fps"
        style="
          text-align: center;
          color: #00ff00;
          font-size: 0.9rem;
          margin-top: 0.5rem;
        "
      ></div>
    </div>

    <!-- 📊 HUD -->
    <div class="hud">
      <div class="hud-item" id="speed">속도: 0 km/h</div>
      <div class="hud-item" id="health">
        <div>전차 체력</div>
        <div class="health-bar">
          <div id="health-fill" class="health-fill"></div>
        </div>
        <div id="health-text">100%</div>
      </div>
      <div class="hud-item danger" id="threat">🚨 위협 감지: 없음</div>
      <div class="hud-item" id="comm">
        <div>📡 통신 신호</div>
        <div class="signal-bar">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>
      <div class="hud-item" id="position">좌표: 없음</div>
      <div class="hud-item" id="gear">
        🔧 기어: <span id="gear-level">2</span>
      </div>
    </div>

    <!-- ⚠️ 알림 -->
    <div id="alert-box" class="alert hidden">알림창</div>

    <!-- 🎮 명령 패널 -->
    <div class="command-panel">
      <input type="text" id="destInput" placeholder="x,y,z" />
      <button onclick="sendDestination()">📍 목적지 설정</button>
      <form method="post" action="/send_action" style="margin-top: 1rem">
        <input type="hidden" name="turret" value="ROTATE" />
        <input type="hidden" name="weight" value="1.0" />
        <button type="submit">🌀 포탑 회전</button>
      </form>
      <button onclick="sendBullet()">💥 발사</button>
    </div>

    <!-- 🧠 대시보드 JS -->
    <script src="/static/js/dashboard.js"></script>
    <script>
      // ✅ 로딩 스크린 제어
      window.addEventListener("DOMContentLoaded", () => {
        const img = document.getElementById("live-image");
        const loading = document.getElementById("loading-screen");

        if (img && loading) {
          img.onload = () => {
            loading.style.opacity = 0;
            setTimeout(() => {
              loading.style.display = "none";
              img.style.display = "block";
            }, 300);
          };
        }
      });
    </script>
  </body>
</html>
