<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🪖 전차 전투 대시보드</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <script defer src="/static/js/dashboard.js"></script>
    <script defer>
      async function updateHUD() {
        try {
          const res = await fetch('/get_hud');
          const data = await res.json();

          const crosshair = document.getElementById("crosshair");
          const hudText = document.getElementById("hud-distance");
          const distance = Math.round(data.distance);
          hudText.textContent = `${distance}m`;

          if (data.is_aimed) {
            crosshair.style.borderColor = "limegreen";
            hudText.style.color = "limegreen";
          } else if (data.is_detected) {
            crosshair.style.borderColor = "red";
            hudText.style.color = "red";
          } else {
            crosshair.style.borderColor = "black";
            hudText.style.color = "black";
          }
        } catch (err) {
          console.warn("HUD 상태 갱신 실패", err);
        }
      }
      setInterval(updateHUD, 500);
    </script>
    
  </head>

  <body>
    </div>

    <div>
      <h3 style="text-align: center; color: #00ff00">탐지 영상</h3>
      <img id="live-image" src="/video_feed" alt="탐지 결과" />
      <div id="fps" style="text-align: center; color: #00ff00; font-size: 0.9rem; margin-top: 0.5rem"></div>
    </div>

    <div id="crosshair"></div>
    <div id="hud-distance">-- m</div>

    <div class="hud">
      <div class="hud-item" id="speed">속도: 0 km/h</div>
      <div class="hud-item" id="health">
        <div>전차 체력</div>
        <div class="health-bar">
          <div id="health-fill" class="health-fill"></div>
        </div>
        <div id="health-text">100%</div>
      </div>
      <div class="hud-item danger" id="threat">🚨 위협 감지: 없음</div>
      <div class="hud-item" id="comm">
        <div>📡 통신 신호</div>
        <div class="signal-bar">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>
      <div class="hud-item" id="position">좌표: 없음</div>
      <div class="hud-item" id="gear">
        🔧 기어: <span id="gear-level">2</span>
      </div>
    </div>

    <div id="alert-box" class="alert hidden">알림창</div>

    <div class="command-panel">
      <input type="text" id="destInput" placeholder="x,y,z" />
      <button onclick="sendDestination()">📍 목적지 설정</button>

      <form method="post" action="/send_action" style="margin-top: 1rem">
        <input type="hidden" name="turret" value="ROTATE" />
        <input type="hidden" name="weight" value="1.0" />
        <button type="submit">🌀 포탑 회전</button>
      </form>

      <button onclick="sendBullet()">💥 발사</button>
    </div>
  </body>
</html>
